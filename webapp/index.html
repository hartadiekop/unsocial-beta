<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dating Mode Required</title>
  <!-- Bootstrap 5 Dark Theme CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #181a1b;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .center-container {
      width: 100%;
      max-width: 400px;
      margin: auto;
      padding: 2rem 1rem;
      background: #23272b;
      border-radius: 1rem;
      box-shadow: 0 2px 16px rgba(0,0,0,0.3);
      text-align: center;
    }
    @media (max-width: 576px) {
      .center-container {
        padding: 1.5rem 0.5rem;
        max-width: 95vw;
      }
    }
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <div class="center-container">
    <h5 class="mb-4">You need to enable Dating Mode to access this feature.</h5>
    <button id="thanksBtn" class="btn btn-primary w-100">Thanks</button>
  </div>
  <script>
    document.getElementById('thanksBtn').onclick = function() {
      if (window.Telegram && Telegram.WebApp) {
        Telegram.WebApp.close();
      }
    };
  </script>
</body>
</html>
